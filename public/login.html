<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            background-image: url('https://www.bing.com/ck/a?!&&p=bf05cbb5e986f8e2cac2ceff9a88c4e62aeaf1420e5ac3875519a05f5f382b49JmltdHM9MTc4MDYxNzYwMA&ptn=3&ver=2&hsh=4&fclid=24cc639e-ec1c-6f65-0f1f-75acedba6ede&u=a1L2ltYWdlcy9zZWFyY2g_cT10ZWNoK2ltYWdlJmlkPUM5M0YzQkJFNjUyN0VCODQ0RUM5NUE1MTlGODlGNDBFQTA1NDg5REYmRk9STT1JUUZSQkE');
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: rgb(33, 30, 30);
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .login-container input {
            width: 90%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #111;
            border-radius: 3px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #111;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #0056b3;
        }
        </style>
</head>
<body>
    <div class="login-container">
        <h2 style="color: navajowhite;">Login</h2>
        <form>
            <input type="text" placeholder="Username" />
            <input type="password" placeholder="Password" />
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
